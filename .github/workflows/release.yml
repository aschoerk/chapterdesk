name: Release

on:
  push:
    tags:
      - 'v*'   # e.g. v0.1.0, v1.2.3

# Never run release builds for the same tag in parallel. Two concurrent runs
# for one tag operate on the SAME GitHub Release: one deletes an asset while
# the other is uploading/restoring its label, which surfaces as
# GitHub API 404 "Not Found" (update-a-release-asset). Serialising per tag
# makes a second push wait, then simply replace the assets (idempotent).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: chapterdesk-linux
          - os: windows-latest
            platform: windows
            artifact: chapterdesk-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install API server dependencies
        run: npm ci --prefix chapterdesk-api-server

      - name: Build Angular + Electron package
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: quiet the NodeGit warning
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache         

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: warn

  sign-windows:
    needs: build
    runs-on: ubuntu-latest
    environment: signing          # damit die Secrets verfügbar sind
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: chapterdesk-windows
          path: dist

      - name: Install ssign
        run: |
          curl -sL https://github.com/Le-Syl21/ssign/releases/latest/download/ssign-linux-x86_64.tar.gz | tar xz
          sudo install -m755 ssign /usr/local/bin/ssign

      - name: Sign Windows binaries
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP:   ${{ secrets.CERTUM_OTP }}
        run: ssign dist/*.exe

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chapterdesk-windows-signed
          path: dist/*

  release:
    needs: [build, sign-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: chapterdesk-linux
          path: release-artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: chapterdesk-windows-signed
          path: release-artifacts/windows

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/linux/*
            release-artifacts/windows/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
