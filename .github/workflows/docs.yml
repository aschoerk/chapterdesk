# Build the MkDocs site and deploy it to GitHub Pages.
#
# Triggered on every push to `main` (and manually). Requires nothing but the
# repo — the workflow builds the static site with the `mkdocs-material` theme
# and deploys it via the official GitHub Pages actions.
#
# After the first successful run, enable it in:
#   Repository → Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# The site then lives at:
#   https://<your-username>.github.io/<repository>/
name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: Build the site
        run: mkdocs build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
