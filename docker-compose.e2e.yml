# E2E-only stack for Playwright.
#
# Reuses the chapterdesk-dev image (Dockerfile.dev) but:
#   - runs the API in MEMORY persistence seeded from e2e/fixtures/seed.json
#   - serves SPA + API + proxy on ONE host port (8081 → container 8080)
#     => no CORS, no ?port= lost in hash-routing, one origin.
#
# Prereqs (build the two dists the mounts provide):
#   npm run build:server     # chapterdesk-api-server/dist (has the seeder)
#   npx ng build             # dist/chat/browser (fresh SPA)
#   docker build -t chapterdesk-dev:latest -f Dockerfile.dev .   # once
#
# Usage:
#   docker compose -f docker-compose.e2e.yml up
#   http://127.0.0.1:8081

name: chapterdesk-e2e

services:
  chapterdesk-e2e:
    image: chapterdesk-dev:latest
    container_name: chapterdesk-e2e
    environment:
      PORT: "8080"
      PERSISTENCE: memory
      CHAPTERDESK_SEED_FILE: /e2e/fixtures/seed.json
      # The Dockerfile.dev bakes CHAPTERDESK_RUNTIME=docker-dev → the client
      # would default to the 'indexeddb-all' storage profile (fresh IDB →
      # imports the demo bundle) and IGNORE the seeded server API. Force the
      # SPA onto the server/seed: sqlite-all makes every data kind hit the
      # HTTP API backed by the in-memory seed.
      CHAPTERDESK_STORAGE: sqlite-all
    ports:
      - "8081:8080"
    volumes:
      # Compiled API (factory.js has CHAPTERDESK_SEED_FILE support) + fresh SPA.
      - ./chapterdesk-api-server/dist:/app/dist
      - ./dist/chat/browser:/app/public
      # Seed fixture (read-only).
      - ./e2e:/e2e:ro
    restart: "no"