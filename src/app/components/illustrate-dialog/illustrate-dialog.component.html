@if (dialog.current(); as d) {
  <div
    class="illustrate-backdrop"
    (click)="onBackdrop($event)"
    (mousedown)="onBackdropMousedown($event)"
    (keydown)="onKey($event)"
    tabindex="0"
  >
    <div
      class="illustrate-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="illustrate-title"
      (click)="$event.stopPropagation()"
    >
      <h3 id="illustrate-title">{{ i18n.t('illustrateDialog.title') }}</h3>

      <!-- 1. Model selection — Default (from settings) first, then the
           last-used choice / every image-capable model. -->
      <label class="ill-field">
        <span>{{ i18n.t('illustrateDialog.modelLabel') }}</span>
        <select
          [ngModel]="modelId()"
          (ngModelChange)="onModelChange($event)"
          [title]="i18n.t('illustrateDialog.modelTitle')"
        >
          <option value="">
            {{ i18n.t('illustrateDialog.modelDefault') }}{{ defaultModelName() ? ' — ' + defaultModelName() : '' }}
          </option>
          @for (model of imageModels(); track model.id) {
            <option [value]="model.modelId">{{ model.displayName }}</option>
          }
        </select>
        <small class="ill-hint">{{ i18n.t('illustrateDialog.modelHint') }}</small>
      </label>

      <!-- 2. Use case selection — how the pictures are produced. -->
      <fieldset class="ill-radio-group">
        <legend>{{ i18n.t('illustrateDialog.usecaseLabel') }}</legend>
        <label class="ill-radio">
          <input
            type="radio"
            name="usecase"
            [checked]="usecase() === 'planned'"
            (change)="onUsecaseChange('planned')"
          />
          <span>
            {{ i18n.t('illustrateDialog.usecasePlanned') }}
            <small class="ill-hint">{{ i18n.t('illustrateDialog.usecasePlannedHint') }}</small>
          </span>
        </label>
        <label class="ill-radio">
          <input
            type="radio"
            name="usecase"
            [checked]="usecase() === 'direct'"
            (change)="onUsecaseChange('direct')"
          />
          <span>
            {{ i18n.t('illustrateDialog.usecaseDirect') }}
            <small class="ill-hint">{{ i18n.t('illustrateDialog.usecaseDirectHint') }}</small>
          </span>
        </label>
        <label class="ill-radio">
          <input
            type="radio"
            name="usecase"
            [checked]="usecase() === 'pure'"
            (change)="onUsecaseChange('pure')"
          />
          <span>
            {{ i18n.t('illustrateDialog.usecasePure') }}
            <small class="ill-hint">{{ i18n.t('illustrateDialog.usecasePureHint') }}</small>
          </span>
        </label>
      </fieldset>

      <!-- 3. Number of pictures / scenes. -->
      <label class="ill-field">
        <span>{{ i18n.t('illustrateDialog.countLabel') }}</span>
        <input
          type="number"
          [min]="1"
          [max]="64"
          [ngModel]="count()"
          (ngModelChange)="onCountInput($event)"
        />
        <small class="ill-hint">{{ i18n.t('illustrateDialog.countHint') }}</small>
      </label>

      <!-- 4. Story text to use — current text / last N beats / all text. -->
      <fieldset class="ill-radio-group">
        <legend>{{ i18n.t('illustrateDialog.contextModeLabel') }}</legend>
        <label class="ill-radio">
          <input
            type="radio"
            name="contextMode"
            [checked]="historyMode() === 'single'"
            (change)="onHistoryMode('single')"
          />
          <span>
            {{ i18n.t('illustrateDialog.contextModeSingle') }}
            <small class="ill-hint">{{ i18n.t('illustrateDialog.contextModeSingleHint') }}</small>
          </span>
        </label>
        <label class="ill-radio">
          <input
            type="radio"
            name="contextMode"
            [checked]="historyMode() === 'window'"
            (change)="onHistoryMode('window')"
          />
          <span>
            <span class="ill-window-line">
              {{ i18n.t('illustrateDialog.contextModeWindow') }}
              <input
                class="ill-window-count"
                type="number"
                [min]="1"
                [max]="64"
                [disabled]="historyMode() !== 'window'"
                [value]="activeHistoryNodes()"
                (input)="onHistoryNodesInput($any($event.target).value)"
                (click)="$event.stopPropagation()"
                aria-label="{{ i18n.t('illustrateDialog.contextNodesLabel') }}"
              />
            </span>
            <small class="ill-hint">{{ i18n.t('illustrateDialog.contextModeWindowHint', { nodes: activeHistoryNodes() }) }}</small>
          </span>
        </label>
        <label class="ill-radio">
          <input
            type="radio"
            name="contextMode"
            [checked]="historyMode() === 'full'"
            (change)="onHistoryMode('full')"
          />
          <span>
            {{ i18n.t('illustrateDialog.contextModeFull') }}
            <small class="ill-hint">{{ i18n.t('illustrateDialog.contextModeFullHint') }}</small>
          </span>
        </label>
      </fieldset>

      <!-- 5. Additional rules that apply to every picture. -->
      <label class="ill-field">
        <span>{{ i18n.t('illustrateDialog.storyPromptLabel') }}</span>
        <textarea
          rows="3"
          [ngModel]="storyboardPrompt()"
          (ngModelChange)="storyboardPrompt.set($event)"
          [placeholder]="i18n.t('illustrateDialog.storyPromptPh')"
        ></textarea>
      </label>

      <!-- 6. Style — a single line. -->
      <label class="ill-field">
        <span>{{ i18n.t('illustrateDialog.styleLabel') }}</span>
        <input
          type="text"
          [ngModel]="style()"
          (ngModelChange)="style.set($event)"
          [placeholder]="i18n.t('illustrateDialog.stylePh')"
        />
      </label>

      <div class="illustrate-actions">
        <button class="btn" type="button" (click)="dialog.cancel()">
          {{ i18n.t('common.cancel') }}
        </button>
        <button class="btn primary" type="button" (click)="submit()">
          {{ i18n.t('illustrateDialog.confirm') }}
        </button>
      </div>
    </div>
  </div>
}
