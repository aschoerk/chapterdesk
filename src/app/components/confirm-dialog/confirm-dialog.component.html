@if (confirm.current(); as d) {
  <div
    class="confirm-backdrop"
    (click)="onBackdrop($event)"
    (mousedown)="onBackdropMousedown($event)"
    (keydown)="onKey($event)"
    tabindex="0"
  >
    <div
      class="confirm-dialog"
      [class.with-prompt]="!!d.prompt"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-message"
      (click)="$event.stopPropagation()"
    >
      <h3 id="confirm-title">{{ d.title }}</h3>
      <p id="confirm-message" class="confirm-message">{{ d.message }}</p>

      @if (d.prompt) {
        <label class="confirm-prompt">
          <span class="confirm-prompt-label">{{ d.prompt.label }}</span>
          <textarea
            [rows]="d.prompt.rows ?? 6"
            [placeholder]="d.prompt.placeholder ?? ''"
            [ngModel]="promptValue()"
            (ngModelChange)="onPromptInput($event)"
          ></textarea>
        </label>
        @if (d.prompt.model; as model) {
          <label class="confirm-model">
            <span class="confirm-prompt-label">{{ model.label }}</span>
            <select
              [ngModel]="modelValue()"
              (ngModelChange)="onModelInput($event)"
              [title]="model.title ?? ''"
            >
              @if (model.groups?.length) {
                @for (group of model.groups; track group.label) {
                  <optgroup [label]="group.label">
                    @for (option of group.options; track option.id) {
                      <option [value]="option.id">{{ option.label }}</option>
                    }
                  </optgroup>
                }
              } @else {
                @for (option of model.options; track option.id) {
                  <option [value]="option.id">{{ option.label }}</option>
                }
              }
            </select>
          </label>
        }
      }

      <div class="confirm-actions">
        <button class="btn" type="button" (click)="confirm.close(false)">
          {{ d.cancelLabel }}
        </button>
        <button
          class="btn primary"
          type="button"
          [class.danger]="d.danger"
          [disabled]="promptBlank()"
          (click)="submit()"
        >
          {{ d.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
